version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      # Babel 8 vereist o.a. vervanging van babelify en ESLint 9; pas updaten bij volledige migratie
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
